# ==========================================
# Build System Configuration
# ==========================================
# Specifies how the project should be built.
# 'setuptools' is a common choice.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta" # The function setuptools uses to build.

# ==========================================
# Core Project Metadata
# ==========================================
# Defines essential information about your project.
[project]
name = "uvr-pyside6-ui"
version = "0.1.0"
description = "Advanced audio source separation with PySide6 GUI - Professional rewrite of Ultimate Vocal Remover"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Kufirre Ebong", email = "kuffykeys@gmail.com"}
]
license = {text = "MIT"}
keywords = ["audio", "vocal", "remover", "separation", "pyside6", "gui", "music", "ml", "ai"]
classifiers = [
    # Standard trove classifiers to categorize the project.
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: X11 Applications :: Qt",
]

# ==========================================
# Core Dependencies
# ==========================================
# Lists the libraries your project needs to run.
dependencies = [
    # UI Framework
    "PySide6>=6.4.0,<7.0.0", # The core UI framework.
    
    # Machine Learning & Audio Processing
    "torch>=1.13.0",        # ML framework.
    "torchaudio>=0.13.0",   # Torch audio utilities.
    "pytorch-lightning>=1.8.0",
    "numpy>=1.21.0",        # Numerical Python.
    "librosa>=0.9.0",       # Audio analysis.
    "soundfile>=0.10.0",    # Reading/writing audio files.
    "scipy>=1.7.0",         # Scientific computing.
    
    # Model Processing
    "onnxruntime>=1.13.0",
    "onnx>=1.12.0",
    "onnx2pytorch>=0.4.0",
    "diffq>=0.2.0",
    "julius>=0.2.7",
    
    # Configuration & Data
    "omegaconf>=2.2.0",
    "pyyaml>=6.0",          # For YAML parsing (MDX-C configs).
    "ml-collections>=0.1.1", # For ConfigDict (MDX-C configs).
    
    # Audio Format Support
    "pydub>=0.25.0",        # For MP3/FLAC export
    "mutagen>=1.45.0",
    
    # Utilities
    "requests>=2.25.0",
    "natsort>=8.0.0",
    "six>=1.16.0",
    "Pillow>=8.0.0",        # Image handling (often needed for icons/assets).
]

# ==========================================
# Optional Dependencies (Extras)
# ==========================================
# Dependencies that are not required for basic functionality but enable extra features.
# Users can install these like: pip install uvr-pyside6-ui[dev,gpu]
[project.optional-dependencies]
dev = [
    # Testing Framework
    "pytest>=7.4.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xvfb>=3.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    
    # Coverage & Reporting
    "coverage>=7.3.0",
    
    # Test Utilities
    "responses>=0.24.0",
    "freezegun>=1.2.0",
    "hypothesis>=6.90.0",
    "factory-boy>=3.3.0",
    
    # Code Quality & Formatting
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit>=1.7.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
    
    # Type checking support
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
    
    # Documentation
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
gpu = [
    # Optional GPU acceleration dependencies.
    "torch[cuda]>=1.13.0",      # Installs PyTorch with CUDA support.
    "onnxruntime-gpu>=1.13.0",  # GPU support for ONNX models (if used).
]
audio-extra = [
    # Additional audio format support (pydub moved to main)
    "ffmpeg-python>=0.2.0", # Requires ffmpeg to be installed on the system.
    "resampy>=0.4.0",
    "audioread>=3.0.0",
]

# ==========================================
# Project URLs
# ==========================================
# Provides helpful links related to your project.
[project.urls]
Homepage = "https://github.com/kufirre/ultimatevocalremovergui"
Repository = "https://github.com/kufirre/ultimatevocalremovergui"
Issues = "https://github.com/kufirre/ultimatevocalremovergui/issues"
Documentation = "https://github.com/kufirre/ultimatevocalremovergui/wiki"
"Original UVR" = "https://github.com/Anjok07/ultimatevocalremovergui"

# ==========================================
# Entry Points / Scripts
# ==========================================
# Defines commands that can be run from the command line after installation.
[project.scripts]
uvr-gui = "uvr_pyside6_ui.main:run" # Creates 'uvr-gui' which calls run() in main.py.

# ==========================================
# Setuptools Configuration
# ==========================================
# Specific settings for the 'setuptools' build backend.
[tool.setuptools]
# Specifies which packages to include.
# Ensure these directories exist at the specified locations and are actual Python packages (contain __init__.py).
packages = ["uvr_pyside6_ui", "demucs", "lib_v5"]

[tool.setuptools.package-dir]
# Maps package names to the directory containing their source.
"uvr_pyside6_ui" = "src/uvr_pyside6_ui" # Main application package
"demucs" = "demucs"                     # Demucs package at project root
"lib_v5" = "lib_v5"                     # lib_v5 package at project root

# ==========================================
# Pytest Configuration
# ==========================================
# Settings for the 'pytest' testing framework.
[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["src"] # Helps pytest find your source code for imports.
testpaths = ["tests"] # Specifies where to look for test files.
addopts = [
    # Additional command-line arguments for pytest.
    "--strict-markers", # Ensures all @pytest.mark decorators are registered.
    "--strict-config",  # Prevents issues with pytest configuration.
    "--verbose",        # Provides more detailed test output.
    "--tb=short",
    "--cov=uvr_pyside6_ui",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
markers = [
    # Defines custom markers for categorizing tests.
    "unit: Unit tests for individual components",
    "integration: Integration tests across components", 
    "gui: GUI/UI interaction tests",
    "ensemble: Ensemble processing tests",
    "audio: Audio processing and manipulation tests",
    "edge_case: Edge cases and error conditions",
    "slow: Tests that take more than 5 seconds",
    "mock_audio: Tests using mocked audio data",
    "model: Model-related functionality tests",
    "worker: Worker thread and processing tests",
    "adapter: Core adapter interface tests",
    "download: Model download and management tests",
    "critical: Critical tests that must pass for basic functionality",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ==========================================
# Coverage Configuration
# ==========================================
[tool.coverage.run]
source = ["src/uvr_pyside6_ui"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# ==========================================
# Black (Code Formatter) Configuration
# ==========================================
# Settings for the 'black' code formatter.
[tool.black]
line-length = 88 # Max line length (common default).
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$' # File types to format.
extend-exclude = '''
/(
  # Standard directories to ignore.
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | demucs
  | lib_v5
  | UVR\.py
  | separate\.py
)/
'''

# ==========================================
# Settings for the 'ruff' linter.
[tool.ruff]
target-version = "py38" # Target Python version for linting rules.
line-length = 88 # Match black's line length.

[tool.ruff.lint]
# Enable selective rules that are most important
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "S3",  # Only critical security issues (bandit)
]

# Ignore certain rules that would require major refactoring
ignore = [
    "E402",  # Module level import not at top of file (common in conditional imports)
    "F841",  # Local variable assigned but never used (common in test mocks)
    "E501",  # Line too long (handled by black)
    "E712",  # Comparison to True/False (sometimes more readable)
    "F811",  # Redefinition of unused (common in test files)
    "S324",  # MD5 usage (legacy compatibility)
    "S110",  # try-except-pass (sometimes necessary)
    "S112",  # try-except-continue (sometimes necessary)
    "S113",  # requests without timeout (external library usage)
]

# Per-file ignores for specific patterns
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "F811", "S101"]  # Allow unused variables and assert in tests
"src/uvr_pyside6_ui/resources_rc.py" = ["ALL"]  # Auto-generated file
"src/uvr_pyside6_ui/core/separate_logic.py" = ["N8", "UP0"]  # Scientific computing naming conventions
"UVR.py" = ["ALL"]  # Legacy file - exclude from all checks
"separate.py" = ["ALL"]  # Legacy file - exclude from all checks

# ==========================================
# MyPy (Static Type Checker) Configuration
# ==========================================
# Settings for 'mypy' for strict type checking.
[tool.mypy]
python_version = "3.8"
warn_return_any = true # Warns if a function returns 'Any' when it shouldn't.
warn_unused_configs = true # Warns about unused mypy config sections.
disallow_untyped_defs = false  # Relaxed for this project
disallow_incomplete_defs = false
check_untyped_defs = true # Checks functions even if they don't have annotations.
disallow_untyped_decorators = false
no_implicit_optional = true # Requires 'Optional[T]' instead of just 'T' if 'None' is possible.
warn_redundant_casts = true # Warns if you cast a variable to its own type.
warn_unused_ignores = true # Warns about unnecessary '# type: ignore' comments.
warn_no_return = true # Warns if a function is missing a return statement when expected.
warn_unreachable = true # Warns about code that will never be executed.
strict_equality = true # Ensures type-safe comparisons.
show_error_codes = true

[[tool.mypy.overrides]]
# Ignores missing type information for certain libraries that may not have full stubs.
module = [
    "librosa.*",
    "soundfile.*",
    "torch.*",
    "torchaudio.*",
    "onnx.*",
    "onnxruntime.*",
    "julius.*",
    "diffq.*",
    "omegaconf.*",
    "ml_collections.*",
    "demucs.*",
    "lib_v5.*",
]
ignore_missing_imports = true

# Exclude legacy files from type checking
[[tool.mypy.overrides]]
module = ["UVR", "separate"]
ignore_errors = true

# ==========================================
# isort (Import Sorter) Configuration  
# ==========================================
# Settings for 'isort' to organize imports.
[tool.isort]
profile = "black" # Compatible with black formatter.
line_length = 88 # Match black's line length.
multi_line_output = 3 # Vertical hanging indent.
include_trailing_comma = true # Add trailing comma to imports.
force_grid_wrap = 0 # Don't force imports into grid format.
use_parentheses = true # Use parentheses for multi-line imports.
ensure_newline_before_comments = true # Add newline before comments.
known_first_party = ["uvr_pyside6_ui"] # Your project's modules.
known_third_party = ["torch", "librosa", "PySide6", "pytest"] # Common third-party libs.
src_paths = ["src", "tests"] # Source directories.
skip_glob = ["demucs/*", "lib_v5/*", "UVR.py", "separate.py"] # Skip legacy directories and files.

# ==========================================
# Bandit (Security Linter) Configuration
# ==========================================
# Settings for 'bandit' security checks.
[tool.bandit]
exclude_dirs = ["tests", "demucs", "lib_v5", ".venv", "venv", "env"]
exclude = ["UVR.py", "separate.py"]  # Exclude legacy files
skips = [
    "B101", # assert_used - allows assert statements
    "B601", # paramiko_calls - if using paramiko
    "B602", # subprocess_popen_with_shell_equals_true
    "B603", # subprocess_without_shell_equals_true  
    "B607", # start_process_with_partial_path
]
