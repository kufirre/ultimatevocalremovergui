[pytest]
# Minimum version requirements
minversion = 7.4

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Add options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=src/uvr_pyside6_ui
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=15
    --no-cov-on-fail
    --timeout=30

# Qt configuration for pytest-qt plugin
qt_api = pyside6

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    ensemble: Tests related to ensemble functionality
    persistence: Tests related to data persistence functionality
    verification: Tests related to VIP code verification functionality
    audio: Tests involving audio processing
    edge_case: Edge case and boundary condition tests
    slow: Slow-running tests that take more time
    model: Tests related to model handling and data
    download: Tests related to model downloading
    cancellation: Tests related to download cancellation functionality
    worker: Tests related to worker/threading functionality
    adapter: Tests related to the UVR core adapter
    processing: Tests related to audio processing workers
    mock_audio: Tests using mocked audio data
    separate_logic: Tests for separation logic and algorithms
    critical: Critical tests that must pass for basic functionality
    vip: Tests related to VIP download functionality and premium models
    qt: Tests that require Qt widgets and PySide6 functionality
    demucs: Tests related to Demucs separation models and processing
    regression: Regression tests to prevent specific issues from reoccurring

# Warnings filters
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*PytestDeprecationWarning.*:pytest.PytestDeprecationWarning

# Logging configuration for tests
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_auto_indent = true

# Timeout settings
timeout = 30
timeout_method = thread
timeout_func_only = false

# Test discovery exclusions
norecursedirs = .* build dist *.egg venv env __pycache__ node_modules

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function 